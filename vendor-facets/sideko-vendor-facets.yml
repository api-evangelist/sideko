# Vendor facets — Sideko. Generates SDKs, CLIs, docs and mock servers from OpenAPI 3.0/3.1, with
# an automatic docs MCP. The headline: broad pointer lift (SDKs, CLI, docs, a mock-server sandbox),
# but its own docs site is a client-rendered shell (a plain GET returned 11 characters of text on
# 2026-09-25). The CLAUDE.md files it writes into SDKs are not Agent Skills and earn nothing.
vendor: sideko
name: Sideko
website: https://sideko.dev
areas:
- sdk-generation
registry_keys: []
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Sideko can lift the SDK pointers (Python, TypeScript, Go, Rust, Java and C# GA, Ruby beta), a CLI, documentation
  and reference pointers, and a sandbox pointer through its mock servers. Each counts only when declared
  in apis.yml. Its docs MCP is one template across customers, so `platform` (0.25). Sideko's own docs
  on the same platform are a JavaScript shell to a plain reader: 11 characters of text before rendering.
  That puts any docs-derived probe on a Sideko site at risk of a false negative. The CLAUDE.md files it
  writes into SDKs are coding-assistant context, not Agent Skills.
features:
- id: sdk-generation
  name: SDK generation
  description: >-
    SDKs from OpenAPI 3.0 or 3.1 for Python, TypeScript, Go, Rust, Java and C# (GA) and Ruby (beta), with
    example snippets and module support.
  source: https://docs.sideko.dev/sdks
  tier: paid
- id: cli-generation
  name: CLI generation
  description: CLI is a GA generation target alongside the SDK languages.
  source: https://docs.sideko.dev/sdks
  tier: paid
- id: docs-platform
  name: Documentation projects
  description: >-
    A deployed docs site per project, with custom pages, generated API references, MDX components, versioning
    and Ask AI.
  source: https://docs.sideko.dev/building-documentation
  tier: paid
- id: mock-servers
  name: Mock servers
  description: Mock servers generated from an API project's OpenAPI.
  source: https://docs.sideko.dev/api-management
  tier: paid
- id: openapi-linting
  name: OpenAPI linting
  description: Linting of uploaded OpenAPI versions within an API project.
  source: https://docs.sideko.dev/api-management
  tier: paid
- id: docs-mcp
  name: Automatic MCP for docs
  description: An MCP server generated automatically for the documentation.
  source: https://sideko.dev/
  tier: paid
- id: llm-assistant-files
  name: LLM coding-assistant files (CLAUDE.md)
  description: >-
    Hybrid codegen writes a CLAUDE.md into Python and TypeScript SDKs, the same file for every coding
    assistant.
  source: https://docs.sideko.dev/sdks/llm-coding-assistant-files
  tier: paid
