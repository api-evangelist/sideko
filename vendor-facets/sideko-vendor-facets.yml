- feature: sdk-generation
  check: openapi_examples
  layer: agent_readiness
  grade: documented
  partial: true
  partial_note: >-
    SDK example snippets are not request/response examples in the contract, so only the Code Samples link
    fallback (0.25) is reached.
  points: 7
  baseline_pass_rate: 0.36
- feature: docs-mcp
  check: mcp_server
  layer: agent_readiness
  grade: platform
  provider_must: Declare the docs MCP in the provider's mcp/ manifest.
  note: >-
    A docs-search server generated automatically for every Sideko docs site is one tool shape across customers,
    which 0.22.0 grades `platform` (0.25). It searches docs; it does not call the API.
  points: 12
  baseline_pass_rate: 0.22
- feature: openapi-linting
  check: operations_description_coverage
  layer: composite
  conditional: true
  condition: The linter reports. The provider has to write the missing descriptions and republish the
    contract.
  catalog_pass_rate: 0.473
  facet: contract_quality
  points: 6
  baseline_pass_rate: 0.643
earns_nothing:
- feature: llm-assistant-files
  check: agent_skill_present
  why: >-
    A CLAUDE.md inside an SDK repo is coding-assistant context, not an Agent Skill, and it is not declared
    on the provider's surface.
- feature: sdk-generation
  check: examples_present
  why: SDK snippets are not request or response examples on the contract's operations.
- feature: sdk-generation
  check: idempotency
  layer: agent_readiness
  why: Generation does not add an idempotency key to the contract.
out_of_reach:
